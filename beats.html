<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07070d">
  <title>Beat Maker</title>
  <link rel="stylesheet" href="css/beats.css">
</head>
<body>
  <main class="beats">
    <header class="top">
      <a class="back" href="index.html" aria-label="Back to the arcade">&larr; Arcade</a>
      <h1>Beat Maker</h1>
    </header>

    <section aria-label="Drum pads">
      <p class="hint">Tap a pad to play it.<span class="keys"> On a keyboard, press <kbd>1</kbd> to <kbd>8</kbd>.</span></p>
      <div class="pads" id="pads"></div>
    </section>

    <section class="loop" aria-label="16-step loop">
      <div class="controls">
        <button type="button" class="ctrl play" id="play" aria-label="Play the loop">
          <span class="icon" aria-hidden="true"></span><span class="label">Play</span>
        </button>
        <label class="tempo">
          <span class="tempo-text">Tempo <b id="tempo-value">100</b> BPM</span>
          <input type="range" id="tempo" min="60" max="180" step="1" value="100">
        </label>
        <button type="button" class="ctrl clear" id="clear">Clear</button>
      </div>
      <div class="undo-bar" id="undo-bar" role="status" hidden>
        Beat cleared. <button type="button" id="undo">Undo</button>
      </div>
      <p class="hint">Switch squares on and off to build a beat, then press Play<span class="keys"> (or <kbd>Space</kbd>)</span>. It loops forever.</p>
      <div class="sequencer" id="sequencer"></div>
    </section>

    <footer class="foot">
      Your beat is saved on this device. No sound on an iPhone? Turn off the silent switch.
    </footer>
  </main>

  <script src="js/beats.js"></script>
</body>
</html>
